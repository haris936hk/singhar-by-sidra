<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:10px;width:100%;font-family:'Inter',sans-serif;">
  <div style="position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;border-radius:2px;background:repeating-linear-gradient(135deg,#E8DCC8 0px,#E8DCC8 16px,#D8B8A0 16px,#D8B8A0 32px);cursor:pointer;" style-hover="{&quot;background&quot;:&quot;repeating-linear-gradient(135deg,#D8B8A0 0px,#D8B8A0 16px,#E8DCC8 16px,#E8DCC8 32px)&quot;}">
    <sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:10px;left:10px;background:#1A1A1A;color:#FFFFF5;font:500 10px 'Inter',sans-serif;letter-spacing:.5px;text-transform:uppercase;padding:4px 9px;border-radius:2px;z-index:2;">{{ badge }}</div>
    </sc-if>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <span style="font:11px ui-monospace,SFMono-Regular,monospace;letter-spacing:.5px;text-transform:uppercase;color:#8A6A50;background:rgba(255,255,245,.65);padding:5px 10px;border-radius:3px;">Product Photo</span>
    </div>
    <sc-if value="{{ soldOut }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:rgba(255,255,245,.6);z-index:2;display:flex;align-items:center;justify-content:center;">
        <span style="font:500 11px 'Inter',sans-serif;letter-spacing:1px;text-transform:uppercase;color:#1A1A1A;background:#FFFFF5;padding:7px 16px;">Sold Out</span>
      </div>
    </sc-if>
    <sc-if value="{{ notSoldOut }}" hint-placeholder-val="{{ true }}">
      <button style="position:absolute;bottom:10px;right:10px;background:rgba(255,255,245,.94);border:none;border-radius:20px;padding:7px 13px;font:500 10.5px 'Inter',sans-serif;letter-spacing:.3px;color:#1A1A1A;cursor:pointer;z-index:2;">Quick Buy</button>
    </sc-if>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div style="font:400 14.5px/1.3 'Playfair Display',serif;color:#1A1A1A;">{{ name }}</div>
    <sc-if value="{{ hasSale }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:baseline;gap:8px;">
        <span style="font:400 12.5px 'Inter',sans-serif;color:#8A6A50;text-decoration:line-through;">{{ price }}</span>
        <span style="font:600 13px 'Inter',sans-serif;color:#C9A25D;">{{ salePrice }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ hasRegular }}" hint-placeholder-val="{{ true }}">
      <span style="font:600 13px 'Inter',sans-serif;color:#1A1A1A;">{{ price }}</span>
    </sc-if>
    <div style="display:flex;gap:7px;margin-top:2px;">
      <sc-for list="{{ swatches }}" as="sw" hint-placeholder-count="3">
        <button onClick="{{ sw.onClick }}" style="width:16px;height:16px;border-radius:50%;border:none;padding:0;cursor:pointer;background:{{ sw.color }};box-shadow:{{ sw.ring }};"></button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { selectedIndex: 0 };
  select = (i) => this.setState({ selectedIndex: i });
  renderVals() {
    const colors = this.props.colors || [];
    return {
      name: this.props.nameProp,
      price: this.props.price,
      salePrice: this.props.salePrice,
      badge: this.props.badge,
      hasBadge: !!this.props.badge,
      soldOut: !!this.props.soldOut,
      notSoldOut: !this.props.soldOut,
      hasSale: !!this.props.salePrice,
      hasRegular: !this.props.salePrice,
      swatches: colors.map((c, i) => ({
        color: c,
        onClick: () => this.select(i),
        ring: i === this.state.selectedIndex ? '0 0 0 2px #FFFFF5, 0 0 0 3px #1A1A1A' : '0 0 0 1px rgba(0,0,0,.15)'
      }))
    };
  }
}
</script>
</body>
</html>
